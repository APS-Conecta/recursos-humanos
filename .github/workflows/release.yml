# The app's release: build and pack on every pull request, sign and publish on a v* tag
# (Estadística's release.yml).
#
# The work lives in the org's shared workflow, pinned by commit SHA. A pull request only builds
# the frontend and packs the tarball: that is the PR build check. A v* tag must equal v + the
# version in appinfo/info.xml, and then, inside this repo's `release` environment (the app key's
# only home, with the owner as required reviewer), the shared workflow signs SHA256SUMS, proves
# the signature against the suite's apps.pub and publishes recursos_humanos.tar.gz, info.xml, SHA256SUMS and
# SHA256SUMS.minisig. The build job never sees the key.
#
# What lands in the tarball is governed by .nextcloudignore at the repo root.
name: Release

on:
  pull_request:
  push:
    tags: ["v*"]

jobs:
  release:
    uses: APS-Conecta/.github/.github/workflows/app-release.yml@064711df8c14749c1de0be7f4975cf737103eed9 # 2026-11-10
    permissions:
      contents: write
    with:
      app-id: recursos_humanos
      # The default build, plus the assertion that it made the bundle and its licence file.
      build: npm ci && make bundles
    secrets:
      APP_SIGNING_KEY: ${{ secrets.APP_SIGNING_KEY }}
      APP_SIGNING_KEY_PASSWORD: ${{ secrets.APP_SIGNING_KEY_PASSWORD }}
